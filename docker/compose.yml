services:
  # ============================================
  # Kafka 인프라 (KRaft 모드 - Zookeeper 불필요)
  # ============================================
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: marketshock-spark-master
    # user: root
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ../data/silver:/data/silver
      - spark_checkpoint:/data/checkpoint
    ports:
      - "7077:7077"   # Spark Master
      - "8081:8080"   # Spark Master UI
      - "4040:4040"   # Spark Application UI (실행 중)
    networks:
      - marketshock-network

  spark-worker:
    build:                       # <-- 이렇게 추가!
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: marketshock-spark-worker
    # user: root
    hostname: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ../data:/silver:/data/silver
      - spark_checkpoint:/data/checkpoint
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    networks:
      - marketshock-network

  ticker_join:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: marketshock-ticker-join
    # Silver 파일 실행
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /app/src/ticker_join.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../src:/app/src
      - ../data/silver:/data/silver
      - spark_checkpoint:/data/checkpoint
      - ../output:/output
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      - marketshock-network
    
  binance_compare:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: marketshock-binance-compare
    # Silver 파일 실행
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /app/src/binance_compare.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../src:/app/src
      - ../data/silver:/data/silver
      - spark_checkpoint:/data/checkpoint
      - ../output:/output
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      - marketshock-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: marketshock-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 모드 설정
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 브로커 환경 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: marketshock-pipeline-cluster-001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marketshock-network

  # Kafka 웹 UI (모니터링용)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: marketshock-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: marketshock-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - marketshock-network

# ============================================
  # 애플리케이션 서비스
  # ============================================

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    working_dir: /app/src
    command: python api_client.py  # ⚠️ src/ 없음! 볼륨 마운트로 /app에 직접 복사됨
    networks:
      - marketshock-network


  # 대화형 셸 (디버깅용)
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    volumes:
      - ../data:/app/data
      - ../output:/app/output
      - ../src:/app/src
    env_file:
      - ../.env
    working_dir: /app/src
    stdin_open: true
    tty: true
    command: /bin/bash
    networks: 
      - marketshock-network

volumes:
  kafka-data:
  spark_checkpoint:

# ============================================
# 네트워크 정의 (Phase 4 Spark 연동 대비)
# ============================================
networks:
  marketshock-network:
    driver: bridge